<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Чек-лист питбайка — готовность</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --card-hover: #242424;
            --text: #e0e0e0;
            --text-muted: #8a8a8a;
            --accent: #ff6a00;
            --accent-soft: rgba(255, 106, 0, 0.15);
            --success: #34c759;
            --danger: #ff3b30;
            --warning: #ffcc00;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.5;
            padding: 20px 16px;
            max-width: 600px;
            margin: 0 auto;
            -webkit-tap-highlight-color: transparent;
        }

        h1 {
            font-size: 2rem;
            text-align: center;
            color: var(--accent);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .checklist-container {
            background-color: var(--card);
            border-radius: var(--radius-lg);
            padding: 20px 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #2a2a2a;
        }

        .checklist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding: 0 8px;
        }

        .progress-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            margin-right: 16px;
        }

        .progress-text {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            white-space: nowrap;
        }

        .progress-bar {
            flex: 1;
            height: 8px;
            background-color: #333;
            border-radius: 20px;
            overflow: hidden;
            min-width: 60px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #ff9f4a);
            border-radius: 20px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .reset-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
            transition: color 0.3s, transform 0.2s;
            line-height: 1;
        }

        .reset-btn:hover {
            color: var(--accent);
            transform: rotate(180deg);
        }

        .reset-btn:active {
            transform: rotate(180deg) scale(0.9);
        }

        .checklist {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .check-item {
            background-color: var(--card-hover);
            border-radius: var(--radius-md);
            overflow: hidden;
            animation: itemFadeIn 0.4s ease forwards;
            opacity: 0;
            transform: translateY(8px);
            transition: background-color 0.3s;
        }

        .check-item:hover {
            background-color: #2d2d2d;
        }

        @keyframes itemFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Стили для чекбокса */
        .check-item input[type="checkbox"] {
            display: none;
        }

        .check-item label {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .custom-check {
            width: 28px;
            height: 28px;
            border: 2px solid #555;
            border-radius: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .custom-check::after {
            content: "✓";
            font-size: 1.2rem;
            font-weight: bold;
            color: #000;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .check-text {
            font-size: 1.05rem;
            color: var(--text);
            position: relative;
            flex: 1;
            transition: color 0.3s;
        }

        .check-text::after {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 0%;
            height: 2px;
            background-color: var(--accent);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(-50%);
            border-radius: 2px;
        }

        /* Состояние checked */
        .check-item input[type="checkbox"]:checked + label .custom-check {
            background-color: var(--accent);
            border-color: var(--accent);
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(255, 106, 0, 0.5);
        }

        .check-item input[type="checkbox"]:checked + label .custom-check::after {
            opacity: 1;
            transform: scale(1);
        }

        .check-item input[type="checkbox"]:checked + label .check-text {
            color: var(--text-muted);
        }

        .check-item input[type="checkbox"]:checked + label .check-text::after {
            width: 100%;
        }

        /* Медиа-запросы */
        @media (max-width: 480px) {
            .check-item label {
                padding: 12px 12px;
                gap: 12px;
            }
            .custom-check {
                width: 24px;
                height: 24px;
                border-radius: 7px;
            }
            .check-text {
                font-size: 0.95rem;
            }
            .progress-text {
                font-size: 0.9rem;
            }
        }

        /* Анимация при загрузке для каждого пункта (задержка) */
        .check-item:nth-child(1) { animation-delay: 0.05s; }
        .check-item:nth-child(2) { animation-delay: 0.1s; }
        .check-item:nth-child(3) { animation-delay: 0.15s; }
        .check-item:nth-child(4) { animation-delay: 0.2s; }
        .check-item:nth-child(5) { animation-delay: 0.25s; }
        .check-item:nth-child(6) { animation-delay: 0.3s; }
        .check-item:nth-child(7) { animation-delay: 0.35s; }
        .check-item:nth-child(8) { animation-delay: 0.4s; }
        .check-item:nth-child(9) { animation-delay: 0.45s; }
        .check-item:nth-child(10) { animation-delay: 0.5s; }
        .check-item:nth-child(11) { animation-delay: 0.55s; }
        .check-item:nth-child(12) { animation-delay: 0.6s; }
        .check-item:nth-child(13) { animation-delay: 0.65s; }
        .check-item:nth-child(14) { animation-delay: 0.7s; }
        .check-item:nth-child(15) { animation-delay: 0.75s; }
        .check-item:nth-child(16) { animation-delay: 0.8s; }
        .check-item:nth-child(17) { animation-delay: 0.85s; }
        .check-item:nth-child(18) { animation-delay: 0.9s; }
        .check-item:nth-child(19) { animation-delay: 0.95s; }
        .check-item:nth-child(20) { animation-delay: 1s; }
        .check-item:nth-child(21) { animation-delay: 1.05s; }
        .check-item:nth-child(22) { animation-delay: 1.1s; }
        .check-item:nth-child(23) { animation-delay: 1.15s; }
        .check-item:nth-child(24) { animation-delay: 1.2s; }
        .check-item:nth-child(25) { animation-delay: 1.25s; }
        .check-item:nth-child(26) { animation-delay: 1.3s; }
        .check-item:nth-child(27) { animation-delay: 1.35s; }
        .check-item:nth-child(28) { animation-delay: 1.4s; }
        .check-item:nth-child(29) { animation-delay: 1.45s; }
        .check-item:nth-child(30) { animation-delay: 1.5s; }
    </style>
</head>
<body>
    <h1>🔧 Готовность питбайка</h1>
    <div class="subtitle">Отметь все пункты перед выездом</div>

    <div class="checklist-container">
        <div class="checklist-header">
            <div class="progress-info">
                <span class="progress-text" id="progressText">0 / 30</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            <button class="reset-btn" id="resetBtn" title="Сбросить все">↺</button>
        </div>

        <ul class="checklist" id="checklist">
            <li class="check-item">
                <input type="checkbox" id="chk1">
                <label for="chk1">
                    <span class="custom-check"></span>
                    <span class="check-text">Проверить уровень масла (щуп, 900 мл)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk2">
                <label for="chk2">
                    <span class="custom-check"></span>
                    <span class="check-text">Прокачать тормоза, проверить колодки</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk3">
                <label for="chk3">
                    <span class="custom-check"></span>
                    <span class="check-text">Натяжение цепи (15–25 мм провис)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk4">
                <label for="chk4">
                    <span class="custom-check"></span>
                    <span class="check-text">Смазать цепь (литий или спец. смазка)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk5">
                <label for="chk5">
                    <span class="custom-check"></span>
                    <span class="check-text">Давление в шинах (1.0–1.2 атм)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk6">
                <label for="chk6">
                    <span class="custom-check"></span>
                    <span class="check-text">Затяжка спиц (звон ключом)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk7">
                <label for="chk7">
                    <span class="custom-check"></span>
                    <span class="check-text">Протяжка осей колёс (перед/зад)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk8">
                <label for="chk8">
                    <span class="custom-check"></span>
                    <span class="check-text">Воздушный фильтр пропитан маслом</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk9">
                <label for="chk9">
                    <span class="custom-check"></span>
                    <span class="check-text">Проверить свечу зажигания (нагар, зазор)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk10">
                <label for="chk10">
                    <span class="custom-check"></span>
                    <span class="check-text">Зазоры клапанов (0.05 впуск / 0.08 выпуск)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk11">
                <label for="chk11">
                    <span class="custom-check"></span>
                    <span class="check-text">Работа карбюратора (холостой ход, отклик)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk12">
                <label for="chk12">
                    <span class="custom-check"></span>
                    <span class="check-text">Герметичность топливной системы</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk13">
                <label for="chk13">
                    <span class="custom-check"></span>
                    <span class="check-text">Заряд аккумулятора (если есть)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk14">
                <label for="chk14">
                    <span class="custom-check"></span>
                    <span class="check-text">Фары, стоп-сигнал, поворотники (если есть)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk15">
                <label for="chk15">
                    <span class="custom-check"></span>
                    <span class="check-text">Крепление руля и рычагов</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk16">
                <label for="chk16">
                    <span class="custom-check"></span>
                    <span class="check-text">Подтяжка подножек и кронштейнов</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk17">
                <label for="chk17">
                    <span class="custom-check"></span>
                    <span class="check-text">Состояние амортизаторов (утечки, люфт)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk18">
                <label for="chk18">
                    <span class="custom-check"></span>
                    <span class="check-text">Крепление защиты двигателя и рамы</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk19">
                <label for="chk19">
                    <span class="custom-check"></span>
                    <span class="check-text">Наличие топлива (и запасной канистры)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk20">
                <label for="chk20">
                    <span class="custom-check"></span>
                    <span class="check-text">Инструменты и запчасти с собой</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk21">
                <label for="chk21">
                    <span class="custom-check"></span>
                    <span class="check-text">Защитная экипировка (шлем, очки, перчатки)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk22">
                <label for="chk22">
                    <span class="custom-check"></span>
                    <span class="check-text">Проверить буксатор (римлок) заднего колеса</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk23">
                <label for="chk23">
                    <span class="custom-check"></span>
                    <span class="check-text">Лапка КПП притянута тросиком (защита)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk24">
                <label for="chk24">
                    <span class="custom-check"></span>
                    <span class="check-text">CDI защищён от воды (камера/изолента)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk25">
                <label for="chk25">
                    <span class="custom-check"></span>
                    <span class="check-text">Подтяжка гаек и болтов двигателя</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk26">
                <label for="chk26">
                    <span class="custom-check"></span>
                    <span class="check-text">Проверить работу сцепления</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk27">
                <label for="chk27">
                    <span class="custom-check"></span>
                    <span class="check-text">Отсутствие подтёков масла и топлива</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk28">
                <label for="chk28">
                    <span class="custom-check"></span>
                    <span class="check-text">Замок руля и ключи (не забыть)</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk29">
                <label for="chk29">
                    <span class="custom-check"></span>
                    <span class="check-text">Документы и аптечка</span>
                </label>
            </li>
            <li class="check-item">
                <input type="checkbox" id="chk30">
                <label for="chk30">
                    <span class="custom-check"></span>
                    <span class="check-text">Позвонить/написать куда едешь</span>
                </label>
            </li>
        </ul>
    </div>

    <script>
        (function() {
            const checkboxes = document.querySelectorAll('.check-item input[type="checkbox"]');
            const progressText = document.getElementById('progressText');
            const progressFill = document.getElementById('progressFill');
            const resetBtn = document.getElementById('resetBtn');
            const totalChecks = checkboxes.length;

            function updateProgress() {
                let checked = 0;
                checkboxes.forEach(cb => {
                    if (cb.checked) checked++;
                });
                const percent = (checked / totalChecks) * 100;
                progressText.textContent = `${checked} / ${totalChecks}`;
                progressFill.style.width = percent + '%';
            }

            // Инициализация
            updateProgress();

            // Слушатели изменений
            checkboxes.forEach(cb => {
                cb.addEventListener('change', updateProgress);
            });

            // Сброс всех чекбоксов
            resetBtn.addEventListener('click', function() {
                checkboxes.forEach(cb => {
                    cb.checked = false;
                });
                updateProgress();
            });

            // Небольшая анимация при загрузке уже учтена через CSS animation-delay
        })();
    </script>
</body>
</html>
